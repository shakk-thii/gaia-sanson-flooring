# After each push to main (every merged pull request), wait for Vercel to
# publish the new version, then notify IndexNow (Bing and other engines)
# of the pages that changed. See scripts/indexnow-submit.mjs.
name: IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Submit changed pages to IndexNow
        run: node scripts/indexnow-submit.mjs
        env:
          BEFORE_SHA: ${{ github.event.before }}
